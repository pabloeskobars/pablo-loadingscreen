<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pablo Scripts — Loading</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-layer" id="bgLayer" aria-hidden="true">
    <img id="bgImage" class="bg-media hidden" alt="" />
    <video id="bgVideo" class="bg-media hidden" muted loop playsinline></video>
    <div class="bg-overlay" id="bgOverlay"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="shell">
    <header class="top">
      <div class="brand" id="brand">
        <img src="assets/logo.png" alt="Pablo Scripts" class="brand-logo" />
        <div class="brand-text">
          <h1 id="serverName">Pablo Scripts</h1>
          <p id="tagline">FiveM scripts — ESX, QB & standalone</p>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Pages">
        <button class="nav-btn active" data-page="about">About</button>
        <button class="nav-btn" data-page="news">News</button>
        <button class="nav-btn" data-page="team">Team</button>
      </nav>

      <a class="discord-btn" id="discordBtn" href="#" target="_blank" rel="noopener">
        <span class="discord-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        </span>
        <span id="discordLabel">Join Discord</span>
        <span class="online-pill hidden" id="onlinePill"><span id="onlineCount">0</span> online</span>
      </a>
    </header>

    <main class="main">
      <section class="page active" id="page-about" data-page="about">
        <p class="eyebrow">About</p>
        <h2 id="aboutTitle">About the project</h2>
        <div class="about-body" id="aboutBody"></div>
      </section>

      <section class="page" id="page-news" data-page="news">
        <p class="eyebrow">Updates</p>
        <h2>News</h2>
        <div class="news-list" id="newsList"></div>
      </section>

      <section class="page" id="page-team" data-page="team">
        <p class="eyebrow">Staff</p>
        <h2>Team</h2>
        <div class="team-grid" id="teamGrid"></div>
        <p class="hint">Click a tag to copy</p>
      </section>
    </main>

    <footer class="bottom">
      <div class="player" id="player">
        <button class="p-btn" id="prevBtn" title="Previous" aria-label="Previous track">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="p-btn play" id="playBtn" title="Play / Pause" aria-label="Play or pause">
          <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
        </button>
        <button class="p-btn" id="nextBtn" title="Next" aria-label="Next track">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 18l8.5-6L6 6zm9.5-12v12h2V6z"/></svg>
        </button>

        <div class="track-meta">
          <p class="track-title" id="trackTitle">No track</p>
          <p class="track-artist" id="trackArtist">—</p>
          <div class="seek" id="seekBar" role="slider" aria-label="Seek" tabindex="0">
            <div class="seek-fill" id="seekFill"></div>
          </div>
        </div>

        <div class="volume">
          <button type="button" class="vol-icon-btn" id="muteBtn" title="Mute" aria-label="Mute">
            <svg class="vol-icon" id="volIconHigh" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg class="vol-icon hidden" id="volIconLow" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>
            </svg>
            <svg class="vol-icon hidden" id="volIconMute" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.35" aria-label="Volume" />
        </div>

        <audio id="audio" preload="auto"></audio>
      </div>

      <div class="load">
        <div class="load-row">
          <span id="loadLabel">Loading resources…</span>
          <span id="loadPct">0%</span>
        </div>
        <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
        <p class="tip" id="tip"></p>
      </div>
    </footer>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
